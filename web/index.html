<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8" />
    <script src="./lib/qrcode.min.js"></script>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>bilibili视频下载器</title>
    <link rel="stylesheet" href="index.css">
    <link rel="stylesheet" href="model.css">
    <link rel="stylesheet" href="setting.css">
</head>

<body>
    <div class="topbar">
        <div class="brand">
            <div class="brand-badge"><span class="download-icon"></span></div>
            <span class="brand-title">Bilibili 下载器</span>
        </div>
        <div class="status">
            <span class="pill"><span id="taskCount">0</span>个任务</span>
            <span class="pill clickable" onclick="openPlayer()">播放器</span>
            <span class="pill clickable" onclick="openMergeTool()">合并工具</span>
            <!-- <span class="pill clickable" onclick="openMoreTools()">更多工具</span> -->
            <span class="pill clickable" onclick="settingWeb.openSetting()">设置</span>
        </div>
        <div class="avatar" id="avatar">登录</div>
    </div>

    <main class="container">
        <!-- 链接输入 -->
        <section class="card">
            <h2 class="card-title">输入视频链接或BV号</h2>
            <div class="input-row">
                <div class="field"><input id="urlInput" type="url" placeholder="输入视频链接..." />
                    <span class="suffix" id="suffix">URL</span>
                </div>
                <button class="btn brand" id="confirmBtn">确认</button>
            </div>
            <!-- <div class="actions"><span class="hint">点击确认后选择清晰度开始下载（演示）。</span></div> -->
        </section>
        <!-- 扫码登录 -->
        <section class="card m-card hidden" id="loginSection">
            <h2 class="card-title">登录</h2>
            <div class="loginQr" id="loginQr">
                <img id="loginQrS" src="./assets/compressed-loading-placeholder.jpg" /><br />
            </div>
            <div class="loginBtn">
                <button class="btn brand" id="refreshLoginQr">刷新二维码</button>
                <button class="btn" id="cancelLogin">取消登录</button>
            </div>
        </section>
        <!-- 视频详情展示与分辨率选择 -->
        <section class="card m-card hidden" id="videoInfoSection">
            <h2 class="card-title">视频信息</h2>
            <div class="video-info" id="videoInfo">
                <div class="thumbnail">
                    <span class="thumbnail-inner">
                        <img id="videoThumbnail" src="./assets/compressed-loading-placeholder.jpg" />
                    </span>
                </div>
                <div class="details">
                    <div class="title" id="videoTitle">视频标题</div>
                    <div class="meta" id="videoMeta">UP主 · 播放量 · 弹幕数 · 发布时间</div>
                    <div class="quality-selection">
                        <label for="qualitySelect">首选清晰度：</label>
                        <select id="qualitySelect"></select>
                    </div>
                    <div class="quality-selection">
                        <label for="qualitySelectAudio">首选音频质量：</label>
                        <select id="qualitySelectAudio"></select>
                    </div>
                    <div class="quality-selection hidden" id="subtitleSelection">
                        <label for="qualitySelectSubtitle">首选字幕：</label>
                        <div class="subtitle-selection-controls">
                            <select id="qualitySelectSubtitle"></select>
                            <button class="btn tiny" id="downloadSelectedSubtitleBtn" type="button">立即下载</button>
                        </div>
                    </div>
                    <div class="quality-selection">
                        <input type="checkbox" id="downloadDanmuCheckbox">
                        <label class="clickable" id="downloadDanmuLabel" onclick="independentDownload.downloadDanmu()">下载弹幕</label>
                        <input type="checkbox" id="downloadCoverCheckbox">
                        <label class="clickable" onclick="independentDownload.downloadCover()">下载封面</label>
                    </div>
                    <!-- 分P视频选择框 -->
                    <div class="multi-part-selector hidden" id="multiPartSelector">
                        <div class="quick-slector">
                            <button class="btn small" onclick="infoSection.selectAllPart()">全选</button>
                            <button class="btn small" onclick="infoSection.ignoreAllPart()">全不选</button>
                            <button class="btn small hidden" id="searchAllCollectionDetails">搜索全部详情</button>
                        </div>
                        <div class="single-selector" id="multiPartSelectorInner">
                            <!-- <label><input class="p-item" type="checkbox" name="part[]" value="1">P1 - 示例分P选择</label> -->
                        </div>
                    </div>
                    <div class="actions">
                        <button class="btn brand" id="downloadBtn">确认下载</button>
                        <!-- 增加合集下载能力 -->
                        <button class="btn hidden" id="searchCollectionBtn">搜索合集</button>
                        <!-- 注意：合集和分P视频并非相同，合集是UP主上传的多个视频组成的合集，而分P视频是一个视频被拆分成多个部分。<br> -->
                        <button class="btn" id="cancelVideoInfo">取消</button>
                    </div>
                </div>
            </div>
        </section>
        <!-- 下载任务展示 -->
        <section class="card m-card">
            <h2 class="card-title">下载任务</h2>
            <div id="tasksContainer" aria-live="polite"></div>
        </section>

        <!-- 弹出框容器 -->
        <!-- 工具弹出框 -->
        <div class="model hidden" id="model">
            <div class="model-content">
                <div class="model-header">
                    <span id="modelTitle">标题</span>
                    <button class="btn small" id="modelCloseBtn">关闭</button>
                </div>
                <div class="model-body" id="modelBody">
                    <!-- 模态框内容 -->
                    <!-- 播放器 -->
                    <!-- 缓存合并工具 -->
                </div>
            </div>
        </div>
        <!-- 设置弹出框 -->
        <div class="model hidden" id="settingModel">
            <div class="model-content">
                <div class="model-header" id="settingModelHeader">
                    <span id="settingModelTitle">设置</span>
                    <button class="btn small" id="settingModelCloseBtn">关闭</button>
                </div>
                <div class="model-body" id="settingModelBody">
                    <div class="setting-tabs" role="tablist" aria-label="设置分类">
                        <button class="btn small setting-tab active" type="button" role="tab" aria-selected="true" aria-controls="basicSettingsTab" id="basicSettingsTabButton" data-setting-tab="basicSettingsTab">基础</button>
                        <button class="btn small setting-tab" type="button" role="tab" aria-selected="false" aria-controls="engineSettingsTab" id="engineSettingsTabButton" data-setting-tab="engineSettingsTab">下载引擎</button>
                        <button class="btn small setting-tab" type="button" role="tab" aria-selected="false" aria-controls="subtitleSettingsTab" id="subtitleSettingsTabButton" data-setting-tab="subtitleSettingsTab">字幕</button>
                        <button class="btn small setting-tab" type="button" role="tab" aria-selected="false" aria-controls="danmakuSettingsTab" id="danmakuSettingsTabButton" data-setting-tab="danmakuSettingsTab">弹幕</button>
                    </div>
                    <div class="setting-tab-panel" role="tabpanel" id="basicSettingsTab" aria-labelledby="basicSettingsTabButton">
                        <!-- 用户信息部分 -->
                        <div class="setting-section">
                            <h3 class="setting-section-title">用户信息</h3>
                            <div class="user-info">
                                <img id="settingUserAvatar" class="user-avatar" src="./assets/compressed-loading-placeholder.jpg" alt="用户头像" />
                                <div class="user-details">
                                    <div class="user-name" id="settingUserName">未登录</div>
                                    <button class="btn small" id="logoutBtn">退出登录</button>
                                </div>
                            </div>
                        </div>

                        <!-- 下载目录部分 -->
                        <div class="setting-section">
                            <h3 class="setting-section-title">下载设置</h3>
                            <div class="setting-item">
                                <label for="downloadPathInput">下载目录：</label>
                                <div class="path-input-group">
                                    <input type="text" id="downloadPathInput" class="path-input" placeholder="选择下载目录..." readonly />
                                    <button class="btn small" id="selectDownloadPathBtn">浏览</button>
                                </div>
                            </div>
                            <div class="setting-item">
                                <label for="danmuDownloadMethodSelect">弹幕下载方式：</label>
                                <select id="danmuDownloadMethodSelect" class="setting-select">
                                    <option value="traditional">传统接口</option>
                                    <option value="protobuf">protobuf 接口</option>
                                </select>
                            </div>
                            <label class="setting-checkbox">
                                <input type="checkbox" id="downloadInFolderCheckbox">
                                <span>在下载目录新建与视频同名的文件夹，所有下载文件放入其中</span>
                            </label>
                            <label class="setting-checkbox hidden" id="downloadFolderNestingSetting">
                                <input type="checkbox" id="downloadFolderNestingCheckbox">
                                <span>启用文件夹嵌套：分P视频按分P标题分层，合集按视频标题分层</span>
                            </label>
                        </div>

                        <!-- CDN 选择部分 -->
                        <div class="setting-section">
                            <h3 class="setting-section-title">CDN 选择</h3>
                            <div class="setting-item">
                                <label for="cdnSelect">下载 CDN：</label>
                                <select id="cdnSelect" class="setting-select">
                                    <option value="">默认（不替换）</option>
                                </select>
                            </div>
                        </div>
                    </div>

                    <div class="setting-tab-panel hidden" role="tabpanel" id="engineSettingsTab" aria-labelledby="engineSettingsTabButton">
                        <div class="setting-section">
                            <h3 class="setting-section-title">下载引擎</h3>
                            <div class="setting-item">
                                <label for="downloadEngineSelect">选择下载引擎：</label>
                                <select id="downloadEngineSelect" class="setting-select">
                                    <option value="node">Node.js 引擎</option>
                                    <option value="node-multi">Node.JS 多线程</option>
                                    <option value="aria2">Aria2 引擎</option>
                                </select>
                            </div>
                            <div class="setting-item hidden" id="aria2ConcurrencySetting">
                                <label for="aria2ConcurrencySelect" id="concurrencySettingLabel">Aria2 并发数：</label>
                                <select id="aria2ConcurrencySelect" class="setting-select">
                                    <option value="1">1</option>
                                    <option value="2">2</option>
                                    <option value="4">4</option>
                                    <option value="8">8</option>
                                    <option value="16">16</option>
                                    <option value="32">32</option>
                                    <option value="64">64</option>
                                </select>
                            </div>
                            <label class="setting-checkbox hidden" id="nodeResumeSetting">
                                <input type="checkbox" id="nodeResumeCheckbox">
                                <span>启用 Node.JS 断点续传（失败后可重试）</span>
                            </label>
                        </div>
                    </div>

                    <div class="setting-tab-panel hidden" role="tabpanel" id="subtitleSettingsTab" aria-labelledby="subtitleSettingsTabButton">
                        <div class="setting-section">
                            <h3 class="setting-section-title">字幕保存</h3>
                            <div class="setting-item">
                                <label for="subtitleFormatSelect">字幕格式：</label>
                                <select id="subtitleFormatSelect" class="setting-select">
                                    <option value="srt">SRT</option>
                                    <option value="ass">ASS</option>
                                </select>
                            </div>
                            <label class="setting-checkbox">
                                <input type="checkbox" id="subtitleAppendLanguage">
                                <span>在字幕文件名后添加语言标志</span>
                            </label>
                        </div>

                        <div class="setting-section hidden" id="assSubtitleSettings">
                            <h3 class="setting-section-title">ASS 字幕设置</h3>
                            <div class="setting-item">
                                <label for="assTitle">字幕标题：</label>
                                <input class="setting-select" type="text" id="assTitle" data-ass-option="title">
                            </div>
                            <div class="setting-item">
                                <label for="assPlayResX">画面宽度：</label>
                                <input class="setting-select" type="number" id="assPlayResX" data-ass-option="playResX" min="1">
                            </div>
                            <div class="setting-item">
                                <label for="assPlayResY">画面高度：</label>
                                <input class="setting-select" type="number" id="assPlayResY" data-ass-option="playResY" min="1">
                            </div>
                            <div class="setting-item">
                                <label for="assFontName">字体：</label>
                                <input class="setting-select" type="text" id="assFontName" data-ass-option="fontName">
                            </div>
                            <div class="setting-item">
                                <label for="assFontSize">字号：</label>
                                <input class="setting-select" type="number" id="assFontSize" data-ass-option="fontSize" min="1">
                            </div>
                            <div class="setting-item">
                                <label for="assPrimaryColor">文字颜色：</label>
                                <input class="setting-select" type="color" id="assPrimaryColor" data-ass-option="primaryColor">
                            </div>
                            <div class="setting-item">
                                <label for="assOutlineColor">描边颜色：</label>
                                <input class="setting-select" type="color" id="assOutlineColor" data-ass-option="outlineColor">
                            </div>
                            <div class="setting-item">
                                <label for="assBackColor">阴影颜色：</label>
                                <input class="setting-select" type="color" id="assBackColor" data-ass-option="backColor">
                            </div>
                            <label class="setting-checkbox">
                                <input type="checkbox" id="assBold" data-ass-option="bold">
                                <span>文字加粗</span>
                            </label>
                            <div class="setting-item">
                                <label for="assOutline">描边宽度：</label>
                                <input class="setting-select" type="number" id="assOutline" data-ass-option="outline" min="0" step="0.1">
                            </div>
                            <div class="setting-item">
                                <label for="assShadow">阴影深度：</label>
                                <input class="setting-select" type="number" id="assShadow" data-ass-option="shadow" min="0" step="0.1">
                            </div>
                            <div class="setting-item">
                                <label for="assAlignment">对齐方式：</label>
                                <select class="setting-select" id="assAlignment" data-ass-option="alignment">
                                    <option value="1">左下</option><option value="2">居中下</option><option value="3">右下</option>
                                    <option value="4">左中</option><option value="5">居中</option><option value="6">右中</option>
                                    <option value="7">左上</option><option value="8">居中上</option><option value="9">右上</option>
                                </select>
                            </div>
                            <div class="setting-item">
                                <label for="assMarginL">左边距：</label>
                                <input class="setting-select" type="number" id="assMarginL" data-ass-option="marginL" min="0">
                            </div>
                            <div class="setting-item">
                                <label for="assMarginR">右边距：</label>
                                <input class="setting-select" type="number" id="assMarginR" data-ass-option="marginR" min="0">
                            </div>
                            <div class="setting-item">
                                <label for="assMarginV">垂直边距：</label>
                                <input class="setting-select" type="number" id="assMarginV" data-ass-option="marginV" min="0">
                            </div>
                        </div>
                    </div>

                    <div class="setting-tab-panel hidden" role="tabpanel" id="danmakuSettingsTab" aria-labelledby="danmakuSettingsTabButton">
                        <div class="setting-section">
                            <h3 class="setting-section-title">弹幕转换</h3>
                            <label class="setting-checkbox">
                                <input type="checkbox" id="danmakuConvertToAss">
                                <span>将 XML 弹幕转换为 ASS</span>
                            </label>
                            <label class="setting-checkbox">
                                <input type="checkbox" id="danmakuConvertStandalone">
                                <span>直接下载弹幕时也转换为 ASS</span>
                            </label>
                            <label class="setting-checkbox">
                                <input type="checkbox" id="danmakuKeepXml">
                                <span>转换为 ASS 后保留原始 XML 文件</span>
                            </label>
                        </div>

                        <div class="setting-section hidden" id="danmakuAssSettings">
                            <h3 class="setting-section-title">ASS 弹幕设置</h3>
                            <div class="setting-item">
                                <label for="danmakuResX">画面宽度：</label>
                                <input class="setting-select" type="number" id="danmakuResX" data-danmaku-option="resX" min="1">
                            </div>
                            <div class="setting-item">
                                <label for="danmakuResY">画面高度：</label>
                                <input class="setting-select" type="number" id="danmakuResY" data-danmaku-option="resY" min="1">
                            </div>
                            <div class="setting-item">
                                <label for="danmakuFontName">字体：</label>
                                <input class="setting-select" type="text" id="danmakuFontName" data-danmaku-option="fontName">
                            </div>
                            <div class="setting-item">
                                <label for="danmakuFontSize">基准字号：</label>
                                <input class="setting-select" type="number" id="danmakuFontSize" data-danmaku-option="fontSize" min="1">
                            </div>
                            <label class="setting-checkbox">
                                <input type="checkbox" id="danmakuScaleFontSize" data-danmaku-option="scaleFontSize">
                                <span>按 XML 原始字号等比缩放</span>
                            </label>
                            <label class="setting-checkbox">
                                <input type="checkbox" id="danmakuBold" data-danmaku-option="bold">
                                <span>文字加粗</span>
                            </label>
                            <div class="setting-item">
                                <label for="danmakuOpacity">不透明度 (0~1)：</label>
                                <input class="setting-select" type="number" id="danmakuOpacity" data-danmaku-option="opacity" min="0" max="1" step="0.05">
                            </div>
                            <div class="setting-item">
                                <label for="danmakuOutlineWidth">描边宽度：</label>
                                <input class="setting-select" type="number" id="danmakuOutlineWidth" data-danmaku-option="outlineWidth" min="0" step="0.1">
                            </div>
                            <div class="setting-item">
                                <label for="danmakuShadowDepth">阴影深度：</label>
                                <input class="setting-select" type="number" id="danmakuShadowDepth" data-danmaku-option="shadowDepth" min="0" step="0.1">
                            </div>
                            <div class="setting-item">
                                <label for="danmakuLineSpacing">轨道行间距：</label>
                                <input class="setting-select" type="number" id="danmakuLineSpacing" data-danmaku-option="lineSpacing" min="0">
                            </div>
                            <div class="setting-item">
                                <label for="danmakuMarginTop">顶部留白：</label>
                                <input class="setting-select" type="number" id="danmakuMarginTop" data-danmaku-option="marginTop" min="0">
                            </div>
                            <div class="setting-item">
                                <label for="danmakuMarginBottom">底部留白：</label>
                                <input class="setting-select" type="number" id="danmakuMarginBottom" data-danmaku-option="marginBottom" min="0">
                            </div>
                            <div class="setting-item">
                                <label for="danmakuScrollArea">滚动区域占比 (0~1)：</label>
                                <input class="setting-select" type="number" id="danmakuScrollArea" data-danmaku-option="scrollArea" min="0.01" max="1" step="0.05">
                            </div>
                            <div class="setting-item">
                                <label for="danmakuFixedArea">固定区域占比 (0~1)：</label>
                                <input class="setting-select" type="number" id="danmakuFixedArea" data-danmaku-option="fixedArea" min="0.01" max="1" step="0.05">
                            </div>
                            <div class="setting-item">
                                <label for="danmakuScrollDuration">滚动耗时（秒）：</label>
                                <input class="setting-select" type="number" id="danmakuScrollDuration" data-danmaku-option="scrollDuration" min="0.1" step="0.5">
                            </div>
                            <div class="setting-item">
                                <label for="danmakuFixedDuration">固定停留（秒）：</label>
                                <input class="setting-select" type="number" id="danmakuFixedDuration" data-danmaku-option="fixedDuration" min="0.1" step="0.5">
                            </div>
                            <div class="setting-item">
                                <label for="danmakuHorizontalPadding">同轨安全间距：</label>
                                <input class="setting-select" type="number" id="danmakuHorizontalPadding" data-danmaku-option="horizontalPadding" min="0">
                            </div>
                            <label class="setting-checkbox">
                                <input type="checkbox" id="danmakuAllowOverlap" data-danmaku-option="allowOverlap">
                                <span>轨道全满时允许重叠（否则丢弃）</span>
                            </label>
                            <div class="setting-item">
                                <label for="danmakuMaxOverlapOffset">最大延后入轨（秒）：</label>
                                <input class="setting-select" type="number" id="danmakuMaxOverlapOffset" data-danmaku-option="maxOverlapOffset" min="0" step="0.1">
                            </div>
                            <div class="setting-item">
                                <label for="danmakuTimeOffset">全局时间偏移（秒）：</label>
                                <input class="setting-select" type="number" id="danmakuTimeOffset" data-danmaku-option="timeOffset" step="0.1">
                            </div>
                            <div class="setting-item">
                                <label for="danmakuBlockModes">屏蔽模式（逗号分隔）：</label>
                                <input class="setting-select" type="text" id="danmakuBlockModes" data-danmaku-option="blockModes" placeholder="如 4,5；留空表示不屏蔽">
                            </div>
                            <label class="setting-checkbox">
                                <input type="checkbox" id="danmakuBlockColor" data-danmaku-option="blockColor">
                                <span>屏蔽所有非白色弹幕</span>
                            </label>
                            <div class="setting-item">
                                <label for="danmakuBlockRegex">正则屏蔽词：</label>
                                <input class="setting-select" type="text" id="danmakuBlockRegex" data-danmaku-option="blockRegex" placeholder="如 剧透|打卡；留空表示不启用">
                            </div>
                            <label class="setting-checkbox">
                                <input type="checkbox" id="danmakuDeduplicate" data-danmaku-option="deduplicate">
                                <span>合并短时间内的重复刷屏弹幕</span>
                            </label>
                            <div class="setting-item">
                                <label for="danmakuDeduplicateWindow">重复判定时间窗口（秒）：</label>
                                <input class="setting-select" type="number" id="danmakuDeduplicateWindow" data-danmaku-option="deduplicateWindow" min="0" step="0.5">
                            </div>
                        </div>
                    </div>

                    <!-- 保存按钮 -->
                    <div class="setting-actions">
                        <button class="btn brand" id="saveSettingBtn">保存并退出</button>
                    </div>
                </div>
            </div>
        </div>

        <div class="hidden">
    </main>
    <div class="spacer"></div>
    <script src="bv_enc.js"></script>
    <script src="folder_structure.js"></script>
    <script src="independent_download.js"></script>
    <script src="select_card.js"></script>
    <script src="model.js"></script>
    <script src="index.js"></script>
    <script src="download_task.js"></script>
    <script src="ui_detail.js"></script>
    <script src="./script/setting_web.js"></script>
    <!-- 开发专用 -->
    <script src="dev.js"></script>
</body>

</html>
